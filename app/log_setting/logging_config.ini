# info about logging configuration file format, see here:
# https://docs.python.org/3/library/logging.config.html#configuration-file-format
[loggers]
keys=root

[handlers]
keys=logconsole,timedlogfile

[formatters]
keys=logfileformatter

[logger_root]
level=DEBUG
handlers=logconsole,timedlogfile

[formatter_logfileformatter]
format=%(levelname)s:     %(asctime)s - [%(name)s.%(funcName)s:%(lineno)d] %(message)s
datefmt=%Y-%m-%dT%H:%M:%S

[handler_logconsole]
class=StreamHandler
level=DEBUG
formatter=logfileformatter
args=(sys.stdout,)

# more information, here:
# https://docs.python.org/3/library/logging.handlers.html#logging.handlers.RotatingFileHandler
[handler_timedlogfile]
class=handlers.TimedRotatingFileHandler
level=DEBUG
args=('./logs/papagaia_timed.log', 'D',1 , 3, None, False, False, None, None)
formatter=logfileformatter

[handler_logfile]
class=handlers.RotatingFileHandler
level=DEBUG
args=('logs/papagaia.log','a',1000000,5)
formatter=logfileformatter